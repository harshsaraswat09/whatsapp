# Render Blueprint for DelegateX
# Deploys the FastAPI backend as a web service and the Vite/React app as a static site.
services:
  # ---------- Backend: FastAPI + WebSockets ----------
  - type: web
    name: delegatex-backend
    runtime: python
    plan: free             # fits in 512MB now that chromadb is out of requirements.txt
    region: singapore
    rootDir: delegateX-main/backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL          # MongoDB Atlas connection string
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_USER            # Gmail address used for SMTP
        sync: false
      - key: EMAIL_PASS            # Gmail app password
        sync: false
      - key: FRONTEND_URL
        value: https://delegatex-frontend.onrender.com
      - key: WHATSAPP_SIMULATION_MODE
        value: "true"
      - key: N8N_WEBHOOK_BASE_URL
        sync: false

  # ---------- Frontend: Vite + React static build ----------
  - type: web
    name: delegatex-frontend
    runtime: static
    rootDir: delegateX-main/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://delegatex-backend.onrender.com
    routes:
      # SPA fallback so react-router deep links don't 404
      - type: rewrite
        source: /*
        destination: /index.html
